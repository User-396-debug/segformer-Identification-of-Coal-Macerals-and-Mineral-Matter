release:
  model_name: segformer
  checkpoint_seed: 2026
  best_checkpoint_epoch: 36
  split_id: fixed_split_v1
  source_checkpoint_sha256: 565ad1146fdb076053502aba07c71fd8784d281a39e845e37e9b6f2374f5c2c2

experiment:
  name: main_comparison
  primary_metric: mean_iou
  class_names: [background, vitrinite, minerals, liptinite, inertinite]

data:
  manifest: experiments/manifests/fixed_split_v1.csv
  image_size: 512
  enable_green_augmentation: true
  sampler_min_red: 1
  sampler_min_green: 1

model:
  model_size: b1
  num_classes: 5
  pretrained: pretrained/mit_b1.pth
  dropout_rate: 0.3
  drop_path_rate: 0.15
  use_edge_enhancement: false
  use_color_attention: false
  use_green_aux_head: false

training:
  num_epochs: 50
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  deterministic: true
  scheduler:
    factor: 0.5
    patience: 3
    min_lr: 0.000001

loss:
  class_weights: [1.0, 1.4, 2.6, 1.2, 1.2]
  focal_gamma: 1.5
  green_pixel_weight: 10.0
  red_pixel_weight: 4.0
  focal_weight: 0.5
  dice_weight: 0.3
  iou_weight: 0.2
  green_aux_weight: 0.0
  green_aux_pos_weight: 60.0
  iou_class_weights: [1.0, 1.0, 3.0, 1.0, 1.0]

device: cuda
num_workers: 4
